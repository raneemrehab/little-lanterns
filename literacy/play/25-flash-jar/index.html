<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flash Jar · Learning Lanterns</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap">
<link rel="stylesheet" href="../shared/engine.css">
<style>
.jar{position:relative;width:40cqmin;height:34cqmin;border-radius:5cqmin 5cqmin 4cqmin 4cqmin;background:rgba(220,236,246,.18);border:.8cqmin solid rgba(255,253,248,.8)}
.lid{position:absolute;left:-2cqmin;right:-2cqmin;top:-4cqmin;height:5cqmin;border-radius:2cqmin;background:#c99a5e;transition:transform .35s ease;transform-origin:10% 100%;z-index:2}
.cover{position:absolute;inset:0;border-radius:4cqmin;background:#3b3355;transition:opacity .3s;z-index:1}
.jar.open .lid{transform:rotate(-28deg) translateY(-2cqmin)}
.jar.open .cover{opacity:0}
.ff{position:absolute;width:7cqmin;height:7cqmin;margin:-3.5cqmin;border-radius:50%;background:radial-gradient(circle,#fff7c2 0 30%,#f5d57a 45%,rgba(245,213,122,0) 72%);box-shadow:0 0 3cqmin 1cqmin rgba(245,213,122,.7)}
.cards .opt{min-width:16cqmin;min-height:16cqmin;padding:1cqmin}
.dc{position:relative;width:13cqmin;height:13cqmin}
.dc i{position:absolute;width:2.8cqmin;height:2.8cqmin;margin:-1.4cqmin;border-radius:50%;background:#3e8a86}
.gap{position:absolute;top:8%;bottom:8%;left:50%;border-left:.5cqmin dashed rgba(255,253,248,.5)}
</style>
</head>
<body>
<script src="../../../games/shared/voice-timing.js"></script>
<script src="../audio/manifest.js"></script>
<script src="../shared/critters.js"></script>
<script src="../shared/engine.js"></script>
<script>
/* Flash Jar (Main · Number Foundations): seeing small amounts at a glance (subitising).
   Voice: LL-LIT-G25-VO01…VO09, shared narrator lines and the maths number words (NUM-n). */
(() => {
  const DICE = { 1: [[50, 50]], 2: [[28, 28], [72, 72]], 3: [[25, 25], [50, 50], [75, 75]], 4: [[28, 28], [72, 28], [28, 72], [72, 72]],
    5: [[25, 25], [75, 25], [50, 50], [25, 75], [75, 75]], 6: [[28, 22], [72, 22], [28, 50], [72, 50], [28, 78], [72, 78]] };
  const levels = [
    { label: '1 · Glow (3–4)', range: [1, 3], look: 2200, kind: 'dice' },
    { label: '2 · Glow (3–4)', range: [1, 4], look: 1800, kind: 'dice' },
    { label: '3 · Flame (4–5)', range: [1, 5], look: 1600, kind: 'scatter' },
    { label: '4 · Flame (4–5)', range: [3, 6], look: 2000, kind: 'groups' },
  ];
  let plan = [];
  function spots(n, kind) {
    if (kind === 'dice') return DICE[n];
    if (kind === 'groups') {                     // two small groups, left and right
      const a = Math.max(1, Math.min(3, n - 1 - Math.floor(Math.random() * 2))), b = n - a;
      const g = (m, x0) => (DICE[m] || DICE[3]).map(([x, y]) => [x0 + x * 0.36, 20 + y * 0.6]);
      return [...g(a, 6), ...g(b, 56)];
    }
    const out = [];                               // scattered, never touching
    while (out.length < n) { const p = [14 + Math.random() * 72, 16 + Math.random() * 68]; if (out.every((q) => Math.hypot(q[0] - p[0], q[1] - p[1]) > 22)) out.push(p); }
    return out;
  }
  const card = (n) => `<span class="dc">${DICE[n].map(([x, y]) => `<i style="left:${x}%;top:${y}%"></i>`).join('')}</span>`;

  LL.game({
    code: 'G25', name: 'Flash Jar', accent: '#3e8a86', dark: true,
    guide: { name: 'Flick the firefly', kind: 'firefly', color: '#f5d57a' },
    bg: 'radial-gradient(120% 90% at 50% 0%, #2f4f6b 0%, #223a52 60%, #182a3d 100%)',
    reward: { icon: '⚡' }, doneLine: 'Super seeing!',
    levels, rounds: 5, intro: ['VO01'], goodbye: 'VO09',
    complete: ['VO08', 'SH-VO03'],
    preload: () => [...Object.keys(window.LL_LINES).filter((k) => k.startsWith('G25-') || k.startsWith('SH-')), ...[1, 2, 3, 4, 5, 6].map((n) => 'NUM-' + n)],
    async levelStart(c) {
      const [lo, hi] = c.L.range; plan = [];
      while (plan.length < 5) { const n = lo + Math.floor(Math.random() * (hi - lo + 1)); if (n !== plan[plan.length - 1]) plan.push(n); }
      await c.say('VO02', 'instruction');                           // Watch the jar. When the lid opens, look quickly. How many fireflies?
    },
    async round(c, i) {
      const L = c.L, n = plan[i];
      const jar = c.el(`<div class="jar"><div class="lid"></div><div class="cover"></div>${L.kind === 'groups' ? '<span class="gap"></span>' : ''}</div>`);
      spots(n, L.kind).forEach(([x, y]) => jar.insertAdjacentHTML('beforeend', `<i class="ff" style="left:${x}%;top:${y}%"></i>`));
      const opts = LL.shuffle([n, n > 1 ? n - 1 : n + 2, n < 6 ? n + 1 : n - 2]);
      const row = c.el(`<div class="row cards"></div>`);
      const items = opts.map((v) => { const b = c.el(`<button class="opt" type="button" aria-label="${v}">${card(v)}</button>`); row.appendChild(b); return { el: b, ok: v === n, v }; });
      c.area.replaceChildren(jar, row);
      let look = L.look;
      const peek = async (ms) => {
        await c.say('VO03', 'transition');                           // Peek!
        jar.classList.add('open'); await c.wait(ms); jar.classList.remove('open'); await c.wait(400);
      };
      const ask = () => c.say(L.kind === 'groups' ? 'VO05' : 'VO04', 'question');
      await c.busy(async () => { await c.wait(400); await peek(look); });
      c.setPrompt(async () => { await peek(look); await ask(); });
      await ask();
      if (i === 0) await c.hearAgainTip();
      await c.choice({
        items, reduce: false, miss1: null, miss2: null, miss3: null,
        onMiss: async () => { await c.say('VO06', 'retry'); look = Math.round(look * 1.5); await peek(look); await ask(); },   // Have another peek!
      });
      await c.busy(async () => {
        jar.classList.add('open');                                   // the lid opens: the fireflies glow beside the card
        await c.say('NUM-' + n, 'count');
        await c.say('VO07', 'praise');                               // You saw it at a glance!
      });
    },
  });
})();
</script>
</body>
</html>
