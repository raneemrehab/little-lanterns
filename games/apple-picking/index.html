<title>Apple Picking</title>
<!--
  APPLE PICKING — Little Lanterns counting game
  Counting & Numbers → One-to-one counting (one number per object)
    Level 1: Tap and count  — tap 3 apples; each one drops into the basket as it is counted
    Level 2: Move and count — drag 5 apples into the basket (tapping also works)
    Level 3: Pick 1 to 5 (in order)     Level 4: Mixed 1 to 5
    Level 5: Pick 6 to 10 (in order)    Level 6: Mixed 1 to 10  (12 apples on the tree, two-row basket)
  Each apple moves into the basket once counted, so it can't be counted twice.
  Finishing Level 1 leads straight into Level 2 with the "Next level" button.

  Self-contained: HTML + CSS + JS + voice clips (base64) in one file.

  Embedding on the website:
    <iframe src="/games/apple-picking/" title="Apple Picking game"
            style="width:100%; aspect-ratio:16/10; border:0; border-radius:24px"></iframe>

  Code map:
    1. CSS tokens + layout
    2. Markup: hidden SVG artwork (tree, apple, basket, hills, cloud), #home, #play, #done
    3. JS: Config, Sound, Stage (fit + scene layout), Game (levels, tap/drag, counting)
    4. VOICE data – base64 MP3s: "one" … "five", plus optional voice-overs
                    'tapApples'  = "Tap the apples"                  (Level 1 start)
                    'moveApples' = "Move the apples into the basket" (Level 2 start)
                    'pick1' … 'pick5' = "Can you pick one apple?" … "Can you pick five apples?"
                                    (start of each Level 3–4 round, matched to the number)
                    'tryAgain'   = "Good guess, but try again" (Levels 3–4, after Check if the count doesn't match)

  Levels 3–4 are self-checking: no voice or numbers while picking. The child presses Check, the voice
  counts the basket aloud, and the child hears whether it matches the number asked for.
                    When a voice-over is missing, the game simply skips it.

  Feedback principle (shared with all Little Lanterns games): nothing is ever marked wrong.
  An apple dropped outside the basket floats gently back to the tree and the basket glows
  as a hint.
-->

<style>
/* Layout: one stage (1280×800 landscape, 800×tall portrait) scaled to fit; a daytime orchard scene laid out from the scene's own size. */
:root{
  --cream:#fbf6ec; --paper:#fffdf8; --ink:#263238; --ink-soft:#56626a; --line:#e8dfcf;
  --teal:#3e8a86; --teal-deep:#2c6b68; --teal-soft:#d8ebe8;
  --butter:#f5d57a; --butter-soft:#fbefc8; --butter-deep:#8a6a12;
  --sky:#ddeef9;
  --display:'Bricolage Grotesque','Nunito Sans',system-ui,sans-serif;
  --body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:4px solid var(--teal);outline-offset:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.art-defs{position:absolute;width:0;height:0;overflow:hidden}

#app{height:100%;box-sizing:border-box;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#viewport{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:50% 50%;background:var(--cream);border-radius:32px;overflow:hidden}
#stage.port{width:800px}
.screen{position:absolute;inset:0;box-sizing:border-box;display:flex}

/* ---------- Home ---------- */
#home{gap:48px;padding:48px}
.sun-blob{position:absolute;right:-120px;top:-140px;width:520px;height:520px;border-radius:50%;background:var(--butter-soft)}
.home-text{position:relative;z-index:1;flex:0 0 500px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{font-weight:800;font-size:14px;letter-spacing:.08em;padding:8px 14px;border-radius:999px;background:var(--teal-soft);color:var(--teal-deep)}
.pill.y{background:var(--butter-soft);color:var(--butter-deep)}
.title{margin:0;font:800 80px/.95 var(--display);letter-spacing:-.02em;text-wrap:balance}
.lead{margin:0;font-size:24px;line-height:1.45;color:var(--ink-soft);max-width:460px}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:4px}
.level-btn{display:flex;align-items:center;gap:12px;min-height:84px;box-sizing:border-box;width:100%;padding:12px 16px;border-radius:28px;border:0;text-align:left;cursor:pointer;transition:transform .1s,box-shadow .1s}
.level-btn.primary{background:var(--teal);color:var(--paper);box-shadow:0 6px 0 var(--teal-deep)}
.level-btn.secondary{background:var(--paper);border:3px solid var(--line);box-shadow:0 6px 0 var(--line)}
.level-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--teal-deep)}
.level-btn.secondary:active{box-shadow:0 2px 0 var(--line)}
.badge{flex:0 0 auto;width:48px;height:48px;font-size:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 30px var(--display);background:var(--paper);color:var(--teal-deep)}
.secondary .badge{background:var(--butter);color:var(--ink)}
.secondary .badge.b3{background:var(--sky);color:var(--teal-deep)}
.secondary .badge.b4{background:#ece7f7;color:#5e4f99}
.secondary .badge.b5{background:#f9e0d8;color:#a84d38}
.secondary .badge.b6{background:#e3eee0;color:#3f6b44}
.lv-text{flex:1;display:flex;flex-direction:column}
.lv-name{font:800 22px/1.1 var(--display)}
.lv-sub{font-size:16px;opacity:.9}
.secondary .lv-sub{color:var(--ink-soft);opacity:1}
.home-sky{flex:1;position:relative;overflow:hidden;background:var(--sky);border-radius:40px}
.home-sky svg{position:absolute;inset:0;width:100%;height:100%}

/* ---------- Play ---------- */
#play{flex-direction:column;gap:20px;padding:28px 40px 32px}
.topbar{display:flex;align-items:center;gap:16px}
.icon-btn{flex:0 0 auto;width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--paper);border:3px solid var(--line);color:var(--ink);cursor:pointer;transition:transform .1s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.sound{background:var(--butter);border-color:var(--butter)}
.titles{flex:1;min-width:0;display:flex;flex-direction:column}
.eyebrow{font-size:14px;font-weight:800;letter-spacing:.08em;color:var(--teal-deep)}
.lv2 .eyebrow{color:var(--butter-deep)}
.game-title{font:800 32px/1.15 var(--display)}
.dots{display:flex;gap:10px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;background:var(--line);transition:background .3s}
.dot.on{background:var(--teal);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.lv2 .dot.on{background:var(--butter)}

#scene{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--sky);border-radius:40px}
#scene > *{position:absolute}
.cloud{opacity:.95}
#hills{left:0;bottom:0}
#tree{z-index:1}
#bGlow{z-index:1;border-radius:50%;background:rgba(245,213,122,.0);transition:background .3s,box-shadow .3s}
#bGlow.on{background:rgba(245,213,122,.45);box-shadow:0 0 50px 24px rgba(245,213,122,.5)}
#bBack{z-index:2}
#bFront{z-index:4;pointer-events:none}
#bFront.bump,#bBack.bump{animation:bump .45s ease}

.apple{z-index:6;padding:0;margin:0;border:0;background:none;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent}
.apple .wob{display:block;width:100%;height:100%;transform-origin:55% 12%;animation:dangle 3.2s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.apple svg{display:block;width:100%;height:100%;overflow:visible}
.apple .n{display:none}
.apple.in{z-index:3;cursor:pointer}
.apple.in .wob{animation:none}
.apple.in .n{display:inline}
.apple.flying,.apple.dragging{z-index:20;cursor:grabbing}
.apple.flying .wob,.apple.dragging .wob{animation:none}
.apple.hint::before{content:"";position:absolute;inset:-16%;border-radius:50%;background:rgba(245,213,122,.5);box-shadow:0 0 40px 14px rgba(245,213,122,.45);z-index:-1;animation:glow 1.4s ease-in-out infinite}
.apple svg.bounce{animation:bounce .5s cubic-bezier(.3,1.5,.5,1)}
#hintLabel{z-index:7;transform:translateX(-50%);background:var(--teal-deep);color:var(--paper);border-radius:999px;padding:6px 16px;font-weight:800;font-size:18px;white-space:nowrap;pointer-events:none;animation:hop 1s ease-in-out infinite}
#bubble{z-index:30;transform:translateX(-50%) scale(0);transform-origin:50% 100%;background:var(--paper);color:var(--ink);border-radius:24px;padding:10px 22px;font:800 36px/1 var(--display);white-space:nowrap;box-shadow:0 6px 0 rgba(38,50,56,.15);transition:transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
#bubble::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-bottom:0;border-top-color:var(--paper)}
#bubble.show{transform:translateX(-50%) scale(1)}
.spark{z-index:25;width:18px;height:18px;margin:-9px 0 0 -9px;background:var(--butter);clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%);animation:burst .8s ease-out forwards;pointer-events:none}

.start-btn{inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border:0;background:rgba(221,238,249,.6);cursor:pointer}
.start-circle{width:170px;height:170px;border-radius:50%;background:var(--butter);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 var(--butter-deep);animation:glow 1.4s ease-in-out infinite}
.start-label{font:800 44px/1 var(--display);color:var(--teal-deep)}

.bottombar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px 24px;box-sizing:border-box;min-height:104px;background:var(--paper);border:3px solid var(--line);border-radius:28px;padding:16px 24px}
.tip-icon{flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:var(--teal-soft);color:var(--teal-deep);display:flex;align-items:center;justify-content:center}
.lv2 .tip-icon{background:var(--butter-soft);color:var(--butter-deep)}
.tip{flex:1 1 380px;margin:0;font-size:26px;font-weight:700;line-height:1.3}
.tip span{color:var(--teal-deep)}
.tip b.target{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:64px;padding:0 10px;margin:0 6px;box-sizing:border-box;border-radius:20px;background:var(--butter);color:var(--ink);font:800 44px/1 var(--display);vertical-align:middle}
.tip b.target.pop{animation:bounce .5s cubic-bezier(.3,1.5,.5,1)}
.port .tip{text-align:center;flex-basis:100%;font-size:32px}
.strip{display:flex;gap:8px}
.tile{width:56px;height:56px;box-sizing:border-box;border-radius:16px;border:3px solid var(--line);color:#7b858b;display:flex;align-items:center;justify-content:center;font:800 30px var(--display);transition:background .3s,color .3s,border-color .3s}
.check-btn{display:flex;align-items:center;gap:10px;min-height:76px;padding:0 34px;border-radius:999px;border:0;background:var(--teal);color:var(--paper);font:800 28px/1 var(--display);cursor:pointer;box-shadow:0 6px 0 var(--teal-deep);transition:transform .1s,box-shadow .1s}
.check-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--teal-deep)}
.check-btn.bounce{animation:bounce .5s cubic-bezier(.3,1.5,.5,1)}
.apple.in.quiet .n{display:none}
.apple.settle{transition:left .3s ease,top .3s ease}
.tile.on{background:var(--teal);border-color:var(--teal);color:var(--paper);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}

/* ---------- Well done ---------- */
#done{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(38,50,56,.22)}
.card{width:720px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:16px;padding:36px 40px;border-radius:40px;background:var(--paper);box-shadow:0 10px 0 rgba(38,50,56,.2);text-align:center;animation:cardin .5s cubic-bezier(.3,1.4,.5,1)}
.stars{display:flex;gap:10px;color:var(--butter)}
.stars svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.card h2{margin:0;font:800 60px/1 var(--display)}
.card p{margin:0;font-size:26px;font-weight:700;color:var(--ink-soft)}
.card-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:8px}
.pill-btn{display:flex;align-items:center;gap:10px;min-height:76px;padding:0 32px;border-radius:999px;font-weight:800;font-size:24px;cursor:pointer;border:3px solid var(--line);background:var(--paper);box-shadow:0 5px 0 var(--line);transition:transform .1s}
.pill-btn.primary{background:var(--teal);border-color:var(--teal);color:var(--paper);box-shadow:0 5px 0 var(--teal-deep)}
.pill-btn:active{transform:translateY(3px)}

/* ---------- Portrait ---------- */
.port #home{flex-direction:column-reverse;padding:40px;gap:32px}
.port .home-text{flex:0 0 auto}
.port .title{font-size:80px}
.port .lead{max-width:none}
.port #play{padding:28px 32px 32px}
.port .tile{width:72px;height:72px;font-size:38px;border-radius:20px}
.port .strip{gap:14px}
.port .bottombar{padding:24px}
.port .card{width:660px}

/* ---------- Motion ---------- */
@keyframes dangle{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes glow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.75}}
@keyframes hop{0%,100%{margin-top:0}50%{margin-top:-6px}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.2) translateY(-8px)}100%{transform:scale(1)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.05,.95)}70%{transform:scale(.98,1.03)}}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(90deg);opacity:0}}
@keyframes cardin{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){
  .apple .wob,#hintLabel,.apple.hint::before,.start-circle{animation:none}
}
</style>

    return {
      unlock, running, say, phrase,
      chime: (n) => { tone(NOTES[n] || 660, 0, 0.7, 0.1); tone((NOTES[n] || 660) * 2, 0.04, 0.45, 0.03); },
      plop: () => { tone(440, 0, 0.18, 0.08); tone(330, 0.06, 0.22, 0.06); },
      fanfare: () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.13, 0.6, 0.1)),
    };
  })();

  /* ================= Stage + scene layout ================= */
  const stage = $('#stage'), viewport = $('#viewport'), scene = $('#scene');
  const isPort = () => stage.classList.contains('port');
  let SCALE = 1, L = null;

  function fit() {
    const W = viewport.clientWidth, H = viewport.clientHeight;
    if (!W || !H) return;
    const port = W / H < 0.85;
    stage.classList.toggle('port', port); stage.classList.toggle('land', !port);
    const sw = port ? 800 : 1280;
    const sh = port ? Math.round(Math.min(1800, Math.max(1100, 800 * H / W))) : 800;
    stage.style.height = sh + 'px';
    SCALE = Math.min(W / sw, H / sh);
    stage.style.transform = `translate(-50%, -50%) scale(${SCALE})`;
    layoutScene();
  }

  const place = (el, x, y, w, h) => { el.style.left = x + 'px'; el.style.top = y + 'px'; if (w != null) { el.style.width = w + 'px'; el.style.height = h + 'px'; el.setAttribute && el.tagName.toLowerCase() === 'svg' && (el.setAttribute('width', w), el.setAttribute('height', h)); } };

  function layoutScene() {
    const W = scene.clientWidth, H = scene.clientHeight;
    if (!W || !H) return;
    const port = isPort();
    let G, tx, ty, TW, TH, bx, by, BW, BH;
    if (!port) {
      // Landscape: tree on the left hill, basket on the right hill.
      G = Math.min(200, H * 0.37);
      const cLx = W * 380 / 1200, cLy = H - G + G * 70 / 220;
      const cRx = W * 1000 / 1200, cRy = H - G + G * 40 / 220;
      TW = Math.min(W * 0.3, 400, (cLy + 14) * 420 / 480);
      TH = TW * 480 / 420; tx = cLx - TW / 2; ty = cLy + 20 - TH;
      BW = Math.min(340, W * 0.3); BH = BW * 200 / 320;
      bx = Math.min(cRx - BW / 2, W - BW - 16); by = cRy + 30 - BH;
    } else {
      // Portrait: a big tree fills the tall sky; the basket sits in front, bottom right.
      G = H * 0.34;
      const trunkX = W * 0.45, trunkBottom = H - G * 0.55;
      TW = Math.min(W * 0.95, trunkBottom * 0.83);
      TH = TW * 480 / 420; tx = trunkX - TW / 2; ty = trunkBottom - TH;
      BW = Math.min(380, W * 0.5); BH = BW * 200 / 320;
      bx = W - BW - 20; by = H - BH - 24;
    }
    const AS = clamp(TW * 0.21, 72, 116), BA = BW * 0.21;
    L = { W, H, tx, ty, TW, TH, bx, by, BW, BH, AS, BA };

    place($('#hills'), 0, H - G, W, G);
    place($('#tree'), tx, ty, TW, TH);
    place($('#bBack'), bx, by, BW, BH);
    place($('#bFront'), bx, by, BW, BH);
    place($('#bGlow'), bx + BW * 0.05, by - BH * 0.05, BW * 0.9, BH * 0.9);
    place($('#cloud1'), port ? W * 0.55 : W * 0.53, port ? 40 : 30);
    place($('#cloud2'), port ? W * 0.08 : W * 0.8, port ? 120 : 60);
    const bub = $('#bubble'); bub.style.left = (bx + BW / 2) + 'px'; bub.style.top = Math.max(10, by - 110) + 'px';
    apples.forEach(positionApple);
    placeHintLabel();
  }

  function treePos(slot) {
    const [vx, vy] = treeSlots()[slot];
    const s = bigTree() ? Math.max(60, L.AS * 0.8) : L.AS;
    return { x: L.tx + vx * L.TW / 420 - s / 2, y: L.ty + vy * L.TH / 480 - s / 2, s };
  }
  function basketPos(k, total) {
    if (total <= 6) {
      const gap = L.BW * 0.147, x0 = L.bx + L.BW / 2 - (total - 1) / 2 * gap;
      const cx = x0 + (k - 1) * gap, cy = L.by + L.BH * (k % 2 ? 0.04 : 0.12);
      return { x: cx - L.BA / 2, y: cy - L.BA / 2, s: L.BA, row: 0 };
    }
    // Up to 12: a back row (1–6) and a front row (7–12), slightly smaller apples.
    const s = L.BW * 0.175, gap = L.BW * 0.135, col = (k - 1) % 6, row = Math.floor((k - 1) / 6);
    const x0 = L.bx + L.BW / 2 - 2.5 * gap + (row ? gap * 0.35 : -gap * 0.15);
    const cx = x0 + col * gap, cy = L.by + L.BH * (row ? 0.12 : -0.05) + (col % 2 ? L.BH * 0.03 : 0);
    return { x: cx - s / 2, y: cy - s / 2, s, row };
  }
  function positionApple(a) {
    if (!L || a.el.classList.contains('flying')) return;
    const p = a.n ? basketPos(a.n, S.slots) : treePos(a.slot);
    place(a.el, p.x, p.y, p.s, p.s);
    a.el.style.zIndex = a.n ? (p.row ? 3 : 2) : '';   // front row of the basket sits in front of the back row
  }

  /* ================= Game state ================= */
  const S = { level: 1, count: 0, goal: 3, slots: 3, round: 0, order: [], busy: false, token: 0, lastTouch: Date.now() };
  let apples = [];
  const alive = (tok) => tok === S.token;
  const LV = () => LEVELS[S.level];

  function setDots(on, total) {
    const d = $('#dots');
    if (d.children.length !== total) d.innerHTML = '<span class="dot"></span>'.repeat(total);
    [...d.children].forEach((el, i) => el.classList.toggle('on', i < on));
  }
  function setStrip(total, on) {
    $('#strip').innerHTML = range(1, total).map((n) => '<span class="tile' + (n <= on ? ' on' : '') + '">' + n + '</span>').join('');
  }

  function restart(el, cls) { el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); }
  const bounceApple = (a) => restart(a.el.querySelector('svg'), 'bounce');
  const bumpBasket = () => { restart($('#bFront'), 'bump'); restart($('#bBack'), 'bump'); };

  let bubbleTimer = 0;
  function speak(n) {
    const b = $('#bubble');
    b.textContent = WORDS[n] + '!';
    b.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => b.classList.remove('show'), 1300);
    $('#sr').textContent = WORDS[n];
  }

  function sparkle(cx, cy) {
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      const ang = (Math.PI * 2 * i) / 8 + Math.random() * 0.4, r = 70 + Math.random() * 40;
      s.style.left = cx + 'px'; s.style.top = cy + 'px';
      s.style.setProperty('--dx', Math.cos(ang) * r + 'px'); s.style.setProperty('--dy', Math.sin(ang) * r + 'px');
      if (i % 2) s.style.background = 'var(--paper)';
      scene.appendChild(s);
      setTimeout(() => s.remove(), 850);
    }
  }

  /* ----- Hint: one waiting apple glows with "tap me!" / "drag me!" ----- */
  let hinted = null;
  function placeHintLabel() {
    const lab = $('#hintLabel');
    if (!hinted || hinted.n) { lab.hidden = true; return; }
    const p = treePos(hinted.slot);
    lab.style.left = (p.x + p.s / 2) + 'px'; lab.style.top = (p.y + p.s + 6) + 'px';
    lab.hidden = false;
  }
  function showHint() {
    apples.forEach((a) => a.el.classList.remove('hint'));
    hinted = apples.find((a) => !a.n) || null;
    if (hinted) { hinted.el.classList.add('hint'); $('#hintLabel').textContent = LV().hint; }
    placeHintLabel();
  }
  function clearHint() { apples.forEach((a) => a.el.classList.remove('hint')); hinted = null; $('#hintLabel').hidden = true; }

  /* ----- Apples ----- */
  function makeApple(slot, i) {
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'apple';
    el.setAttribute('aria-label', 'Apple');
    el.style.setProperty('--d', (-i * 0.7) + 's');
    el.innerHTML = '<span class="wob"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#sym-apple"/>' +
      '<text class="n" x="50" y="72" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="38" fill="#263238"></text></svg></span>';
    const a = { el, slot, n: 0 };
    attachPointer(a);
    scene.appendChild(el);
    return a;
  }

  function attachPointer(a) {
    let start = null, moved = false;
    a.el.addEventListener('pointerdown', (e) => {
      Sound.unlock(); S.lastTouch = Date.now();
      if (a.n) {
        if (S.busy) return;
        if (LV().pick) returnApple(a);                          // pick levels: put it back on the tree to fix the answer
        else { bounceApple(a); speak(a.n); Sound.say(a.n); }    // levels 1–2: hear its number again
        return;
      }
      if (S.busy) return;
      e.preventDefault();
      try { a.el.setPointerCapture(e.pointerId); } catch (err) {}
      start = { x: e.clientX, y: e.clientY }; moved = false;
    });
    a.el.addEventListener('pointermove', (e) => {
      if (!start) return;
      const dx = (e.clientX - start.x) / SCALE, dy = (e.clientY - start.y) / SCALE;
      if (!moved && Math.hypot(dx, dy) > 12) { moved = true; a.el.classList.add('dragging'); $('#bGlow').classList.add('on'); $('#hintLabel').hidden = true; }
      if (moved) a.el.style.transform = `translate(${dx}px, ${dy}px) scale(1.1)`;
    });
    const end = (e) => {
      if (!start) return;
      const dx = (e.clientX - start.x) / SCALE, dy = (e.clientY - start.y) / SCALE;
      start = null;
      $('#bGlow').classList.remove('on');
      a.el.classList.remove('dragging');
      if (!moved) { countApple(a, 0, 0); return; }
      const p = treePos(a.slot), cx = p.x + p.s / 2 + dx, cy = p.y + p.s / 2 + dy;
      const inBasket = cx > L.bx - 40 && cx < L.bx + L.BW + 40 && cy > L.by - 90 && cy < L.by + L.BH;
      if (inBasket) { countApple(a, dx, dy); return; }
      // Not in the basket: float gently back to the tree, and the basket glows as a hint. Nothing is marked wrong.
      a.el.style.transition = 'transform .45s cubic-bezier(.3,1.3,.5,1)';
      a.el.style.transform = '';
      setTimeout(() => { a.el.style.transition = ''; }, 460);
      $('#bGlow').classList.add('on'); bumpBasket();
      setTimeout(() => $('#bGlow').classList.remove('on'), 900);
    };
    a.el.addEventListener('pointerup', end);
    a.el.addEventListener('pointercancel', (e) => { if (start) { start = null; a.el.classList.remove('dragging'); a.el.style.transform = ''; $('#bGlow').classList.remove('on'); } });
  }

  async function countApple(a, dx, dy) {
    if (S.busy || a.n) return;
    // Pick levels: quick tappers can send several apples flying at once. Levels 1–2 go one at a time.
    const quick = !!LV().pick;
    if (!quick) S.busy = true;
    clearHint();
    const tok = S.token;
    const n = ++S.count; a.n = n;
    a.el.querySelector('.n').textContent = n;
    a.el.setAttribute('aria-label', 'Apple ' + n);
    const from = treePos(a.slot), to = basketPos(n, S.slots);
    // Jump the element to its basket spot, then animate from where it was along a little arc.
    a.el.classList.add('flying');
    a.el.style.transform = '';
    place(a.el, to.x, to.y, to.s, to.s);
    const ox = from.x + dx - to.x, oy = from.y + dy - to.y, k = from.s / to.s;
    const midY = Math.min(oy, 0) - 120;
    a.el.style.transformOrigin = '0 0';
    const anim = a.el.animate([
      { transform: `translate(${ox}px, ${oy}px) scale(${k})` },
      { transform: `translate(${ox / 2}px, ${midY}px) scale(${(k + 1) / 2})`, offset: 0.55 },
      { transform: 'translate(0, 0) scale(1)' },
    ], { duration: 750, easing: 'ease-in-out' });
    await anim.finished.catch(() => {});
    a.el.style.transformOrigin = '';
    if (!alive(tok)) return;
    a.el.classList.remove('flying'); a.el.classList.add('in');
    positionApple(a);
    bumpBasket(); bounceApple(a);
    if (LV().pick) {
      // Pick levels: no counting voice and no numbers while picking. The child counts by themselves,
      // then presses Check to hear the basket counted aloud.
      a.el.classList.add('quiet');
      Sound.plop();
      S.lastTouch = Date.now();
      return;
    }
    sparkle(to.x + to.s / 2, to.y + to.s / 2);
    speak(n); Sound.chime(n); Sound.say(n);
    setDots(n, S.goal);
    setStrip(S.goal, n);
    S.lastTouch = Date.now();
    if (n >= S.goal) { finish(); return; }
    S.busy = false;
    setTimeout(() => { if (alive(tok) && !S.busy && !hinted) showHint(); }, 1400);
  }

  // Pick levels: tap an apple in the basket to put it back on the tree.
  async function returnApple(a) {
    if (a.el.classList.contains('flying')) return;
    S.lastTouch = Date.now();
    const tok = S.token, from = basketPos(a.n, S.slots), to = treePos(a.slot), gone = a.n;
    a.n = 0; S.count--;
    a.el.classList.remove('in', 'quiet');
    a.el.setAttribute('aria-label', 'Apple');
    // The apples after it shuffle along to close the gap.
    apples.filter((b) => b.n > gone).forEach((b) => { b.n--; b.el.querySelector('.n').textContent = b.n; b.el.classList.add('settle'); positionApple(b); setTimeout(() => b.el.classList.remove('settle'), 320); });
    a.el.classList.add('flying');
    place(a.el, to.x, to.y, to.s, to.s);
    a.el.style.transformOrigin = '0 0';
    const k = from.s / to.s, ox = from.x - to.x, oy = from.y - to.y;
    await a.el.animate([
      { transform: `translate(${ox}px, ${oy}px) scale(${k})` },
      { transform: `translate(${ox / 2}px, ${Math.min(oy, 0) - 80}px) scale(${(k + 1) / 2})`, offset: 0.5 },
      { transform: 'translate(0, 0) scale(1)' },
    ], { duration: 600, easing: 'ease-in-out' }).finished.catch(() => {});
    a.el.style.transformOrigin = '';
    if (!alive(tok)) return;
    a.el.classList.remove('flying');
    positionApple(a);
    Sound.plop();
  }

  // Pick levels: the child says "I'm done". Now the voice counts the basket, so they can hear if it matches.
  async function check() {
    Sound.unlock(); S.lastTouch = Date.now();
    if (S.busy || !LV().pick) return;
    const tok = S.token;
    S.busy = true; clearHint();
    while (apples.some((a) => a.el.classList.contains('flying'))) await sleep(80);   // let any apple in the air land first
    if (!alive(tok)) return;
    const inBasket = apples.filter((a) => a.n).sort((p, q) => p.n - q.n);
    for (const a of inBasket) {
      if (!alive(tok)) return;
      a.el.classList.remove('quiet');
      bounceApple(a); speak(a.n);
      await Sound.say(a.n); await sleep(220);
    }
    if (!alive(tok)) return;
    if (inBasket.length === S.goal) { roundDone(); return; }
    // Not the number asked for: "Good guess, but try again". Nothing is marked wrong; the child adjusts and checks again.
    await sleep(250);
    const tg = $('#target'); if (tg) restart(tg, 'pop');
    await Sound.phrase('tryAgain');
    if (!alive(tok)) return;
    inBasket.forEach((a) => a.el.classList.add('quiet'));
    S.busy = false; S.lastTouch = Date.now();
  }

  /* ----- Sound needs a tap on some browsers: big Start button if it hasn't begun ----- */
  async function ensureAudio(tok) {
    Sound.unlock();
    await sleep(250);
    if (Sound.running() || !alive(tok)) return alive(tok);
    const btn = $('#startBtn');
    btn.hidden = false;
    await new Promise((res) => { btn.onclick = () => { Sound.unlock(); res(); }; });
    btn.hidden = true;
    await sleep(150);
    return alive(tok);
  }

  function show(screen) {
    $('#home').hidden = screen !== 'home';
    $('#play').hidden = screen !== 'play';
    $('#done').hidden = true;
    $('#startBtn').hidden = true;
    layoutScene();
  }
  function goHome() { S.token++; S.busy = false; show('home'); }

  async function start(level) {
    S.token++; S.level = level; S.count = 0; S.busy = true; S.lastTouch = Date.now();
    const tok = S.token, lv = LV();
    stage.classList.toggle('lv2', level >= 2);
    $('#strip').hidden = !!lv.pick;
    $('#checkBtn').hidden = !lv.pick;
    $('#eyebrow').textContent = lv.eyebrow;
    apples.forEach((a) => a.el.remove());
    apples = [];   // the old level's apples may sit on a different-sized tree
    clearHint();
    if (lv.pick) {
      S.round = 0;
      S.order = lv.pick.slice();
      if (lv.mixed) { do shuffle(S.order); while (S.order.join() === lv.pick.join()); }
      if (lv.mix) S.order = shuffle([...shuffle(range(1, 5)).slice(0, lv.mix.small), ...shuffle(range(6, 10)).slice(0, lv.mix.big)]);
      setDots(0, S.order.length);
      show('play');
      if (!(await ensureAudio(tok))) return;
      newRound(tok);
      return;
    }
    S.goal = lv.apples; S.slots = lv.apples;
    $('#tip').innerHTML = lv.tip;
    const slots = shuffle(range(0, treeSlots().length - 1)).slice(0, lv.apples);
    apples = slots.map((s, i) => makeApple(s, i));
    setDots(0, lv.apples); setStrip(lv.apples, 0);
    show('play');
    if (!(await ensureAudio(tok))) return;
    S.busy = false; S.lastTouch = Date.now();
    showHint();
    await Sound.phrase(lv.voice);   // "Tap the apples" / "Move the apples into the basket" (skipped if not recorded yet)
  }

  /* ----- Level 3: "Pick 1 apple", "Pick 2 apples" … ----- */
  function plural(n) { return n === 1 ? 'apple' : 'apples'; }
  async function newRound(tok) {
    const lv = LV();
    S.count = 0; S.goal = S.order[S.round]; S.busy = true;
    apples.forEach((a) => a.el.remove());
    apples = [];
    clearHint();
    const slots = shuffle(range(0, treeSlots().length - 1)).slice(0, lv.apples);
    apples = slots.map((s, i) => makeApple(s, i));
    S.slots = lv.apples;   // room in the basket for every apple, so the child can put in too many or too few
    $('#tip').innerHTML = 'Pick <b class="target" id="target">' + S.goal + '</b> ' + plural(S.goal) + '!';
    layoutScene();
    S.busy = false; S.lastTouch = Date.now();
    if (S.round === 0) showHint();
    await sayTask(tok);
  }
  // Read the task out: "Can you pick three apples?" (one recording per number).
  async function sayTask(tok) {
    const tg = $('#target');
    if (tg) restart(tg, 'pop');
    const key = 'pick' + S.goal;
    if (VOICE[key]) {
      setTimeout(() => { if (alive(tok) && tg) restart(tg, 'pop'); }, PHRASE_MS[key] * 0.6);   // bounce as the number is said
      await Sound.phrase(key);
      S.lastTouch = Date.now();
      return;
    }
    // Fallback if a recording is missing: the general voice-over (if any), then the number.
    await Sound.phrase(LV().voice);
    if (!alive(tok)) return;
    if (tg) restart(tg, 'pop');
    await Sound.say(S.goal);
    S.lastTouch = Date.now();
  }
  async function roundDone() {
    const lv = LV(), tok = S.token;
    S.busy = true;
    await sleep(300);
    Sound.fanfare();
    sparkle(L.bx + L.BW / 2, L.by + L.BH * 0.2);
    setDots(S.round + 1, S.order.length);
    await sleep(1300);
    if (!alive(tok)) return;
    S.round++;
    if (S.round >= S.order.length) { finish(true); return; }
    // Basket empties gently, a fresh tree, the next number.
    await Promise.all(apples.map((a) => a.el.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(-30px)' }], { duration: 350, fill: 'forwards' }).finished.catch(() => {})));
    if (!alive(tok)) return;
    newRound(tok);
  }

  // Count everything in the basket together, then celebrate.
  async function countBasket(tok) {
    const inBasket = apples.filter((a) => a.n).sort((p, q) => p.n - q.n);
    for (const a of inBasket) {
      if (!alive(tok)) return false;
      bounceApple(a); speak(a.n);
      await Sound.say(a.n); await sleep(160);
    }
    return alive(tok);
  }

  async function finish(alreadyCounted) {
    const lv = LV(), tok = S.token, total = S.goal;
    S.busy = true;
    if (!alreadyCounted) {
      await sleep(1000);
      if (!(await countBasket(tok))) return;
    }
    sparkle(L.bx + L.BW / 2, L.by + L.BH * 0.2);
    Sound.fanfare();
    const star = '<svg width="52" height="52" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/></svg>';
    $('#stars').innerHTML = star.repeat(5);
    [...$('#stars').children].forEach((s, i) => (s.style.animationDelay = (0.15 + i * 0.12) + 's'));
    if (lv.pick) {
      $('#doneTitle').textContent = 'You picked them all!';
      $('#doneText').textContent = lv.doneText;
    } else {
      $('#doneTitle').textContent = 'You counted ' + total + ' apples!';
      $('#doneText').textContent = range(1, total).join(', ') + '. One number for each apple.';
    }
    $('#nextLabel').textContent = lv.next.label;
    await sleep(400);
    if (!alive(tok)) return;
    $('#done').hidden = false;
    $('#nextBtn').focus({ preventScroll: true });
  }

  async function replay() {
    Sound.unlock(); S.lastTouch = Date.now();
    if (S.busy) return;
    const tok = S.token;
    if (LV().pick) { S.busy = true; await sayTask(tok); if (alive(tok)) S.busy = false; return; }
    if (!S.count) {
      if (hinted) bounceApple(hinted);
      if (LV().pick) { S.busy = true; await sayTask(tok); if (alive(tok)) S.busy = false; }
      else await Sound.phrase(LV().voice);
      return;
    }
    S.busy = true;
    if (await countBasket(tok)) { S.busy = false; if (hinted) bounceApple(hinted); }
  }

  /* ================= Wiring ================= */
  $('#go1').addEventListener('click', () => { Sound.unlock(); start(1); });
  $('#go2').addEventListener('click', () => { Sound.unlock(); start(2); });
  $('#go3').addEventListener('click', () => { Sound.unlock(); start(3); });
  $('#go4').addEventListener('click', () => { Sound.unlock(); start(4); });
  $('#go5').addEventListener('click', () => { Sound.unlock(); start(5); });
  $('#go6').addEventListener('click', () => { Sound.unlock(); start(6); });
  $('#back').addEventListener('click', goHome);
  $('#replay').addEventListener('click', replay);
  $('#checkBtn').addEventListener('click', check);
  $('#again').addEventListener('click', () => start(S.level));
  $('#nextBtn').addEventListener('click', () => LV().next.go());

  setInterval(() => {
    if ($('#play').hidden || !$('#done').hidden || S.busy) return;
    if (Date.now() - S.lastTouch < IDLE_NUDGE_MS) return;
    S.lastTouch = Date.now();
    if (LV().pick && S.count) { restart($('#checkBtn'), 'bounce'); return; }
    if (!hinted) showHint();
    if (hinted) bounceApple(hinted);
  }, 1000);

  if (window.ResizeObserver) new ResizeObserver(fit).observe(viewport);
  window.addEventListener('resize', fit);
  fit();
})();
</script>
