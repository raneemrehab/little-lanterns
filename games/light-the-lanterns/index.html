<title>Light the Lanterns</title>
<!--
  LIGHT THE LANTERNS — Little Lanterns counting game (rote counting 1–5, Levels 1–2)
  Self-contained: HTML + CSS + JS + voice clips (base64) in one file.

  Embedding on the website:
    <iframe src="light-the-lanterns.html" title="Light the Lanterns game"
            style="width:100%; aspect-ratio:16/10; border:0; border-radius:24px"
            allow="autoplay"></iframe>
  The game scales itself to whatever box it is given (landscape or portrait).

  Code map:
    1. CSS tokens + layout          (brand colours from the Little Lantern site)
    2. Markup: #home, #play, #done  (three screens inside one scaled 'stage')
    3. JS: Sound   – voice clips + small chimes (Web Audio, with <audio> fallback)
           Stage   – fits the 1280×800 / 800×1280 stage into the screen
           Game    – Level 1 (count along) and Level 2 (what comes next?)
    4. VOICE data  – base64 MP3s for "one" … "five" (swap these to change the voice)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: one fixed-size stage (1280×800 landscape, 800×1280 portrait) scaled to fit; night-sky panel holds the lanterns. */
:root{
  --cream:#fbf6ec; --paper:#fffdf8; --ink:#263238; --ink-soft:#56626a; --line:#e8dfcf;
  --teal:#3e8a86; --teal-deep:#2c6b68; --teal-soft:#d8ebe8;
  --sage:#93b795; --sage-deep:#3f6b44;
  --butter:#f5d57a; --butter-soft:#fbefc8; --butter-deep:#8a6a12;
  --coral:#e7836c; --sky:#86bde3; --sky-soft:#ddeef9; --lav:#ae9fd8; --lav-soft:#ece7f7;
  --glow:rgba(245,213,122,.5);
  --display:'Bricolage Grotesque','Nunito Sans',system-ui,sans-serif;
  --body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--teal);outline-offset:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100%;box-sizing:border-box;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#viewport{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:50% 50%;background:var(--cream);border-radius:32px;overflow:hidden}
#stage.port{width:800px;height:1280px}
.screen{position:absolute;inset:0;box-sizing:border-box;display:flex}

/* ---------- Night sky panel ---------- */
.sky{position:relative;overflow:hidden;background:var(--teal-deep);border-radius:40px;--wire:48px;--sscale:1}
.wire{position:absolute;left:0;right:0;top:var(--wire);height:4px;background:var(--sage);opacity:.6}
.hill{position:absolute;left:0;right:0;bottom:0;height:110px;background:var(--sage-deep);border-radius:50% 50% 0 0/50px 50px 0 0;z-index:1}
.star{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--butter);animation:twinkle 3s ease-in-out infinite}
.star.s{width:8px;height:8px;background:var(--butter-soft)}
.row{position:absolute;left:32px;right:32px;top:calc(var(--wire) + 2px);display:flex;justify-content:space-around;align-items:flex-start;z-index:2}

/* ---------- Lantern ---------- */
.lantern{--bw:116px;--bh:148px;--nf:72px;position:relative;display:flex;flex-direction:column;align-items:center;background:none;border:0;margin:0;padding:0 12px 12px;cursor:pointer;transform-origin:50% 0;animation:sway 4.2s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.string{width:3px;height:calc(var(--s) * var(--sscale));background:var(--sage)}
.lamp{display:flex;flex-direction:column;align-items:center}
.cap{width:calc(var(--bw) * .41);height:16px;background:var(--ink-soft);border-radius:6px 6px 2px 2px;transition:background .3s}
.base{width:calc(var(--bw) * .29);height:12px;background:var(--ink-soft);border-radius:2px 2px 6px 6px;transition:background .3s}
.body{position:relative;box-sizing:border-box;width:var(--bw);height:var(--bh);border-radius:calc(var(--bw) * .45);display:flex;align-items:center;justify-content:center;border:4px dashed rgba(255,253,248,.5);background:rgba(255,253,248,.06);color:rgba(255,253,248,.62);font:800 var(--nf)/1 var(--display);transition:background .35s,border-color .35s,color .35s,box-shadow .6s}
.body::after{content:"";position:absolute;left:22%;top:14%;width:16%;height:22%;border-radius:50%;background:var(--paper);opacity:0;transition:opacity .4s}
.lantern.lit .body{background:var(--c);border:4px solid var(--c);color:var(--ink);box-shadow:0 0 70px 20px var(--glow)}
.lantern.lit .body::after{opacity:.35}
.lantern.lit .cap,.lantern.lit .base{background:var(--ink)}
.lantern.next .body{border-color:var(--paper);color:var(--paper);animation:ring 1.4s ease-out infinite}
.lantern.question .body{border-color:var(--butter);color:var(--butter);background:rgba(245,213,122,.15);animation:ring 1.4s ease-out infinite}
.lantern.blank .num{visibility:hidden}
.hint{display:none;flex-direction:column;align-items:center;margin-top:10px;color:var(--butter);font-weight:800;font-size:20px;animation:hop 1s ease-in-out infinite}
.lantern.next .hint{display:flex}
.bubble{position:absolute;left:50%;top:calc(100% - 6px);z-index:3;transform:translateX(-50%) scale(0);transform-origin:50% 0;background:var(--paper);color:var(--ink);border-radius:24px;padding:10px 22px;font:800 34px/1 var(--display);white-space:nowrap;box-shadow:0 6px 0 rgba(38,50,56,.18);transition:transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.bubble::before{content:"";position:absolute;left:50%;top:-10px;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--paper)}
.bubble.show{transform:translateX(-50%) scale(1)}
.lamp.bounce{animation:bounce .5s cubic-bezier(.3,1.5,.5,1)}
.lamp.shake{animation:shake .45s ease}
.spark{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;background:var(--butter);clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%);animation:burst .8s ease-out forwards;pointer-events:none}

/* ---------- Home ---------- */
#home{gap:48px;padding:48px}
.sun{position:absolute;right:-120px;top:-140px;width:520px;height:520px;border-radius:50%;background:var(--butter-soft)}
.home-text{position:relative;z-index:1;flex:0 0 500px;display:flex;flex-direction:column;justify-content:center;gap:24px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{font-weight:800;font-size:14px;letter-spacing:.08em;padding:8px 14px;border-radius:999px;background:var(--teal-soft);color:var(--teal-deep)}
.pill.y{background:var(--butter-soft);color:var(--butter-deep)}
.title{margin:0;font:800 88px/.95 var(--display);letter-spacing:-.02em;text-wrap:balance}
.lead{margin:0;font-size:24px;line-height:1.45;color:var(--ink-soft);max-width:440px}
.levels{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.level-btn{display:flex;align-items:center;gap:18px;min-height:100px;box-sizing:border-box;width:100%;padding:16px 24px;border-radius:28px;border:0;text-align:left;cursor:pointer;transition:transform .1s,box-shadow .1s}
.level-btn.primary{background:var(--teal);color:var(--paper);box-shadow:0 6px 0 var(--teal-deep)}
.level-btn.secondary{background:var(--paper);border:3px solid var(--line);box-shadow:0 6px 0 var(--line)}
.level-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--teal-deep)}
.level-btn.secondary:active{box-shadow:0 2px 0 var(--line)}
.badge{flex:0 0 auto;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 30px var(--display);background:var(--paper);color:var(--teal-deep)}
.secondary .badge{background:var(--butter);color:var(--ink)}
.lv-text{flex:1;display:flex;flex-direction:column}
.lv-name{font:800 28px/1.1 var(--display)}
.lv-sub{font-size:17px;opacity:.9}
.secondary .lv-sub{color:var(--ink-soft);opacity:1}
.go{flex:0 0 auto}
.home-sky{flex:1;--wire:64px}
.home-sky .lantern{--bw:88px;--bh:112px;--nf:52px}
.home-sky .hill{height:150px;border-radius:50% 50% 0 0/60px 60px 0 0}

/* ---------- Play ---------- */
#play{flex-direction:column;gap:20px;padding:28px 40px 32px}
.topbar{display:flex;align-items:center;gap:16px}
.icon-btn{flex:0 0 auto;width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--paper);border:3px solid var(--line);color:var(--ink);cursor:pointer;transition:transform .1s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.sound{background:var(--butter);border-color:var(--butter)}
.titles{flex:1;min-width:0;display:flex;flex-direction:column}
.eyebrow{font-size:14px;font-weight:800;letter-spacing:.08em;color:var(--teal-deep)}
.lv2 .eyebrow{color:var(--butter-deep)}
.game-title{font:800 32px/1.15 var(--display)}
.dots{display:flex;gap:10px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;background:var(--line);transition:background .3s}
.dot.on{background:var(--teal);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.lv2 .dot.on{background:var(--butter)}
.play-sky{flex:1;min-height:0}
.bottombar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px 24px;box-sizing:border-box;min-height:104px;background:var(--paper);border:3px solid var(--line);border-radius:28px;padding:16px 24px}
.tip-icon{flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:var(--teal-soft);color:var(--teal-deep);display:flex;align-items:center;justify-content:center}
.tip{flex:1 1 380px;margin:0;font-size:26px;font-weight:700;line-height:1.3}
.tip span{color:var(--teal-deep)}
.strip{display:flex;gap:8px}
.tile{width:56px;height:56px;box-sizing:border-box;border-radius:16px;border:3px solid var(--line);color:#7b858b;display:flex;align-items:center;justify-content:center;font:800 30px var(--display);transition:background .3s,color .3s,border-color .3s}
.tile.on{background:var(--teal);border-color:var(--teal);color:var(--paper);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.question{flex:1 1 300px;display:flex;flex-direction:column;gap:4px}
.q-title{font:800 36px/1.1 var(--display)}
.q-seq{font-size:28px;font-weight:800;color:var(--ink-soft);letter-spacing:.02em}
.q-seq b{color:var(--butter-deep)}
.choices{display:flex;gap:18px}
.choice{width:116px;height:116px;border-radius:32px;border:0;background:var(--f);box-shadow:0 6px 0 var(--e);font:800 66px/1 var(--display);color:var(--ink);cursor:pointer;transition:transform .1s,box-shadow .1s,opacity .3s}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--e)}
.choice:disabled{cursor:default}
.choice.wrong{opacity:.35;animation:shake .45s ease}
.choice.right{background:var(--teal);color:var(--paper);box-shadow:0 6px 0 var(--teal-deep);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.choice.c1{--f:var(--sky-soft);--e:var(--sky)}
.choice.c2{--f:var(--butter-soft);--e:var(--butter)}
.choice.c3{--f:var(--lav-soft);--e:var(--lav)}

/* ---------- Well done ---------- */
#done{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(38,50,56,.28)}
.card{width:700px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:16px;padding:36px 40px;border-radius:40px;background:var(--paper);box-shadow:0 10px 0 rgba(38,50,56,.25);text-align:center;animation:cardin .5s cubic-bezier(.3,1.4,.5,1)}
.stars{display:flex;gap:10px;color:var(--butter)}
.stars svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.card h2{margin:0;font:800 60px/1 var(--display)}
.card p{margin:0;font-size:26px;font-weight:700;color:var(--ink-soft)}
.card-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:8px}
.pill-btn{display:flex;align-items:center;gap:10px;min-height:76px;padding:0 32px;border-radius:999px;font-weight:800;font-size:24px;cursor:pointer;border:3px solid var(--line);background:var(--paper);box-shadow:0 5px 0 var(--line);transition:transform .1s}
.pill-btn.primary{background:var(--teal);border-color:var(--teal);color:var(--paper);box-shadow:0 5px 0 var(--teal-deep)}
.pill-btn:active{transform:translateY(3px)}

/* ---------- Portrait stage ---------- */
.port #home{flex-direction:column-reverse;padding:40px;gap:32px}
.port .home-text{flex:0 0 auto}
.port .title{font-size:84px}
.port .lead{max-width:none}
.port .home-sky{--sscale:.85}
.port #play{padding:28px 32px 32px}
.port .play-sky{--wire:110px;--sscale:1.6}
.port .play-sky .lantern{--bw:128px;--bh:164px;--nf:82px;padding:0 4px 12px}
.port .play-sky .row{left:34px;right:34px;justify-content:space-between}
.port .play-sky .string{height:calc(var(--sp) * var(--sscale))}
.port .home-sky .lantern{--bw:104px;--bh:132px;--nf:62px}
.port .play-sky .hill{height:150px;border-radius:50% 50% 0 0/60px 60px 0 0}
.port .tile{width:72px;height:72px;font-size:38px;border-radius:20px}
.port .strip{gap:14px}
.port .choice{width:150px;height:150px;font-size:84px;border-radius:40px}
.port .choices{gap:28px}
.port .bottombar{padding:24px}
.port .question{align-items:center;text-align:center;flex-basis:100%}
.port .card{width:640px}

/* ---------- Motion ---------- */
@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(245,213,122,.6)}100%{box-shadow:0 0 0 22px rgba(245,213,122,0)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.18) translateY(-10px)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(90deg);opacity:0}}
@keyframes cardin{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){
  .lantern,.star,.hint{animation:none}
  .lantern.next .body,.lantern.question .body{animation:none;box-shadow:0 0 0 10px rgba(245,213,122,.35)}
}
</style>

<div id="app"><div id="viewport"><div id="stage" class="land">

  <!-- ============ START SCREEN ============ -->
  <section id="home" class="screen" aria-label="Start">
    <div class="sun" aria-hidden="true"></div>
    <div class="home-text">
      <div class="pills"><span class="pill">COUNTING &amp; NUMBERS</span><span class="pill y">LEVEL 1–2</span></div>
      <h1 class="title">Light the Lanterns</h1>
      <p class="lead">Count from 1 to 5 and make the night sky glow.</p>
      <div class="levels">
        <button type="button" class="level-btn primary" id="go1">
          <span class="badge">1</span>
          <span class="lv-text"><span class="lv-name">Count along</span><span class="lv-sub">Tap each lantern and say the number</span></span>
          <svg class="go" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
        </button>
        <button type="button" class="level-btn secondary" id="go2">
          <span class="badge">2</span>
          <span class="lv-text"><span class="lv-name">What comes next?</span><span class="lv-sub">Pick the missing number</span></span>
          <svg class="go" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <div class="sky home-sky">
      <div class="wire"></div>
      <span class="star" style="left:9%;top:36%" aria-hidden="true"></span>
      <span class="star s" style="left:84%;top:26%;animation-delay:-1s" aria-hidden="true"></span>
      <span class="star" style="left:66%;top:80%;animation-delay:-2s" aria-hidden="true"></span>
      <span class="star s" style="left:22%;top:84%;animation-delay:-.5s" aria-hidden="true"></span>
      <div class="row" id="homeRow"></div>
      <div class="hill"></div>
    </div>
  </section>

  <!-- ============ GAME SCREEN ============ -->
  <section id="play" class="screen" aria-label="Game" hidden>
    <div class="topbar">
      <button type="button" class="icon-btn" id="back" aria-label="Back to start">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="titles">
        <span class="eyebrow" id="eyebrow">LEVEL 1 · COUNT ALONG</span>
        <span class="game-title">Light the Lanterns</span>
      </div>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <button type="button" class="icon-btn sound" id="replay" aria-label="Hear the counting again">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
    </div>

    <div class="sky play-sky">
      <div class="wire"></div>
      <span class="star" style="left:7%;top:62%" aria-hidden="true"></span>
      <span class="star" style="left:88%;top:58%;animation-delay:-1.4s" aria-hidden="true"></span>
      <span class="star s" style="left:48%;top:14%;animation-delay:-.7s" aria-hidden="true"></span>
      <span class="star s" style="left:30%;top:74%;animation-delay:-2.1s" aria-hidden="true"></span>
      <div class="row" id="playRow"></div>
      <div class="hill"></div>
    </div>

    <div class="bottombar" id="bar1">
      <div class="tip-icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>
      </div>
      <p class="tip">Tap the lanterns in order. <span>Say each number out loud!</span></p>
      <div class="strip" id="strip" aria-hidden="true"></div>
    </div>

    <div class="bottombar" id="bar2" hidden>
      <div class="question">
        <span class="q-title">What comes next?</span>

      </div>
      <div class="choices" id="choices"></div>
    </div>
  </section>

  <!-- ============ WELL DONE ============ -->
  <div id="done" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
      <div class="stars" id="stars" aria-label="5 stars"></div>
      <h2 id="doneTitle">You counted to 5!</h2>
      <p>1, 2, 3, 4, 5. All the lanterns are glowing.</p>
      <div class="card-btns">
        <button type="button" class="pill-btn" id="again">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          Play again
        </button>
        <button type="button" class="pill-btn primary" id="nextBtn">Next: Level 2
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="sr-only" aria-live="polite" id="sr"></div>
</div></div></div>

<script>
/* ======================================================================

<script>
(() => {
  'use strict';

  /* ---------------- Config ---------------- */
  const WORDS   = ['', 'one', 'two', 'three', 'four', 'five'];
  const COLORS  = ['', 'var(--coral)', 'var(--butter)', 'var(--sage)', 'var(--sky)', 'var(--lav)'];
  const HOME_STRINGS = [70, 160, 90, 190, 110];   // px, how far each lantern hangs (start screen)
  const PLAY_STRINGS = [40, 100, 60, 120, 80];    // px, game screen (landscape)
  const PORT_STRINGS = [40, 230, 100, 290, 160];  // px, game screen (portrait: zig-zag, stretched to fit)
  const SPEECH_MS = {1: 600, 2: 580, 3: 680, 4: 650, 5: 580}; // when each recorded word ends
  const IDLE_NUDGE_MS = 6000;

  const $ = (s) => document.querySelector(s);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  /* ---------------- Sound ---------------- */
  const Sound = (() => {
    let ctx = null, ready = Promise.resolve();
    const buffers = {};
    const toBuf = (b64) => { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
    const decode = (buf) => new Promise((res, rej) => { const p = ctx.decodeAudioData(buf, res, rej); if (p && p.then) p.then(res, rej); });

    function unlock() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          try {
            ctx = new AC();
            ready = Promise.all([1, 2, 3, 4, 5].map((n) => decode(toBuf(VOICE[n])).then((b) => { buffers[n] = b; }).catch(() => {})));
          } catch (e) { ctx = null; }
        }
      }
      if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ready;
    }

    async function say(n) {
      await unlock();
      if (ctx && buffers[n]) {
        const src = ctx.createBufferSource(); src.buffer = buffers[n];
        src.connect(ctx.destination); src.start();
      } else {
        try { new Audio('data:audio/mpeg;base64,' + VOICE[n]).play().catch(() => {}); } catch (e) {}
      }
      return sleep(SPEECH_MS[n] || 700);
    }

    function tone(freq, at, dur, type, vol) {
      if (!ctx) return;
      const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.05);
    }
    const NOTES = [0, 523.25, 587.33, 659.25, 783.99, 880];
    return {
      unlock, say,
      chime: (n) => { tone(NOTES[n], 0, 0.7, 'sine', 0.1); tone(NOTES[n] * 2, 0.04, 0.45, 'sine', 0.035); },
      oops:  () => { tone(330, 0, 0.18, 'triangle', 0.1); tone(262, 0.15, 0.3, 'triangle', 0.1); },
      fanfare: () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.13, 0.6, 'sine', 0.1)),
    };
  })();

  /* ---------------- Stage scaling ---------------- */
  const stage = $('#stage'), viewport = $('#viewport');
  function fit() {
    const W = viewport.clientWidth, H = viewport.clientHeight;
    if (!W || !H) return;
    const port = W / H < 0.85;
    stage.classList.toggle('port', port);
    stage.classList.toggle('land', !port);
    // Portrait stage stretches to the screen's shape so phones use their full height.
    const sw = port ? 800 : 1280;
    const sh = port ? Math.round(Math.min(1800, Math.max(1100, 800 * H / W))) : 800;
    stage.style.height = sh + 'px';
    const s = Math.min(W / sw, H / sh);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
    if (window.__tuneStrings) window.__tuneStrings();
  }
  // In portrait the sky is tall: lengthen the strings so the lanterns fill it.
  function tuneStrings() {
    const port = stage.classList.contains('port');
    [['.home-sky', 190, 150, 64], ['.play-sky', 290, 300, 110]].forEach(([sel, maxS, lampAndLabels, wire]) => {
      const sky = document.querySelector(sel);
      if (!port) { sky.style.removeProperty('--sscale'); return; }
      const h = sky.clientHeight; if (!h) return;
      const hill = 150;
      const sc = (h - wire - lampAndLabels - hill) / maxS;
      sky.style.setProperty('--sscale', Math.max(0.5, Math.min(2.2, sc)).toFixed(2));
    });
  }
  window.__tuneStrings = tuneStrings;
  if (window.ResizeObserver) new ResizeObserver(fit).observe(viewport);
  window.addEventListener('resize', fit);
  fit();

  /* ---------------- Lantern helpers ---------------- */
  function makeLantern(n, stringPx) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'lantern';
    b.dataset.n = n;
    b.style.setProperty('--c', COLORS[n]);
    b.style.setProperty('--s', stringPx + 'px');
    b.style.setProperty('--d', (-n * 0.85) + 's');
    b.setAttribute('aria-label', 'Lantern ' + n);
    b.innerHTML =
      '<span class="string"></span>' +
      '<span class="lamp"><span class="cap"></span><span class="body"><span class="num">' + n + '</span></span><span class="base"></span></span>' +
      '<span class="hint" aria-hidden="true"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>tap me!</span>' +
      '<span class="bubble" aria-hidden="true"></span>';
    return b;
  }

  const homeRow = $('#homeRow'), playRow = $('#playRow');
  const homeLanterns = [null], lanterns = [null];
  for (let n = 1; n <= 5; n++) {
    const h = makeLantern(n, HOME_STRINGS[n - 1]); h.classList.add('lit'); homeRow.appendChild(h); homeLanterns.push(h);
    const p = makeLantern(n, PLAY_STRINGS[n - 1]); p.style.setProperty('--sp', PORT_STRINGS[n - 1] + 'px'); playRow.appendChild(p); lanterns.push(p);
  }

  function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  const lampOf = (el) => el.querySelector('.lamp');
  const bounce = (el) => restart(lampOf(el), 'bounce');
  const shake  = (el) => restart(lampOf(el), 'shake');

  function setState(n, ...cls) {
    const el = lanterns[n];
    el.classList.remove('lit', 'next', 'question', 'blank');
    cls.forEach((c) => c && el.classList.add(c));
    el.querySelector('.num').textContent = el.classList.contains('question') ? '?' : n;
    el.setAttribute('aria-label', el.classList.contains('question') ? 'Mystery lantern' : 'Lantern ' + n);
  }

  const bubbleTimers = new WeakMap();
  function speak(el, n) {
    const b = el.querySelector('.bubble');
    b.textContent = WORDS[n] + '!';
    b.classList.add('show');
    clearTimeout(bubbleTimers.get(b));
    bubbleTimers.set(b, setTimeout(() => b.classList.remove('show'), 1300));
    $('#sr').textContent = WORDS[n];
  }

  function sparkle(el) {
    const body = el.querySelector('.body');
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      const a = (Math.PI * 2 * i) / 8 + Math.random() * 0.4, r = 95 + Math.random() * 40;
      s.style.setProperty('--dx', Math.cos(a) * r + 'px');
      s.style.setProperty('--dy', Math.sin(a) * r + 'px');
      if (i % 2) s.style.background = 'var(--paper)';
      body.appendChild(s);
      setTimeout(() => s.remove(), 850);
    }
  }

  /* ---------------- Game state ---------------- */
  const S = { level: 1, next: 1, k: 1, busy: false, token: 0, lastTouch: Date.now() };
  const alive = (tok) => tok === S.token;

  function setDots(on, total) {
    const d = $('#dots');
    if (d.children.length !== total) d.innerHTML = '<span class="dot"></span>'.repeat(total);
    [...d.children].forEach((el, i) => el.classList.toggle('on', i < on));
  }
  function setStrip(on) {
    const st = $('#strip');
    if (!st.children.length) st.innerHTML = [1, 2, 3, 4, 5].map((n) => '<span class="tile">' + n + '</span>').join('');
    [...st.children].forEach((el, i) => el.classList.toggle('on', i < on));
  }

  // Count 1..k out loud, each lantern bouncing as its number is spoken.
  async function countAlong(k, tok) {
    for (let i = 1; i <= k; i++) {
      if (!alive(tok)) return false;
      bounce(lanterns[i]); speak(lanterns[i], i);
      await Sound.say(i);
      await sleep(160);
    }
    return alive(tok);
  }

  function show(screen) {
    $('#home').hidden = screen !== 'home';
    $('#play').hidden = screen !== 'play';
    $('#done').hidden = true;
    tuneStrings();
  }

  /* ----- Level 1: Count along ----- */
  function startLevel1() {
    S.token++; S.level = 1; S.next = 1; S.busy = false; S.lastTouch = Date.now();
    stage.classList.remove('lv2');
    $('#eyebrow').textContent = 'LEVEL 1 · COUNT ALONG';
    $('#bar1').hidden = false; $('#bar2').hidden = true;
    for (let n = 1; n <= 5; n++) setState(n, n === 1 ? 'next' : '');
    setDots(0, 5); setStrip(0);
    show('play');
  }

  async function level1Tap(n) {
    if (S.busy) return;
    const el = lanterns[n];
    if (n < S.next) { bounce(el); speak(el, n); Sound.say(n); return; }
    if (n > S.next) { shake(el); Sound.oops(); bounce(lanterns[S.next]); return; }

    // correct
    setState(n, 'lit'); bounce(el); sparkle(el); speak(el, n);
    Sound.chime(n); Sound.say(n);
    setDots(n, 5); setStrip(n);
    S.next++;
    if (S.next <= 5) {
      const tok = S.token; await sleep(350);
      if (alive(tok) && S.level === 1) setState(S.next, 'next');
    } else {
      finish();
    }
  }

  /* ----- Level 2: What comes next? ----- */
  function startLevel2() {
    S.token++; S.level = 2; S.k = 1; S.lastTouch = Date.now();
    stage.classList.add('lv2');
    $('#eyebrow').textContent = 'LEVEL 2 · WHAT COMES NEXT?';
    $('#bar1').hidden = true; $('#bar2').hidden = false;
    setDots(0, 4);
    show('play');
    runRound();
  }

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function seqText(upTo, withGap) {
    const nums = []; for (let i = 1; i <= upTo; i++) nums.push(i);
    return nums.join(', ') + (withGap ? ', <b>…</b>' : '');
  }

  async function runRound() {
    const tok = S.token, k = S.k, target = k + 1;
    S.busy = true;
    for (let n = 1; n <= 5; n++) {
      if (n <= k) setState(n, 'lit');
      else if (n === target) setState(n, 'question');
      else setState(n, 'blank');
    }
    $('#qseq').innerHTML = seqText(k, true);

    const others = shuffle([1, 2, 3, 4, 5].filter((v) => v !== target)).slice(0, 2);
    const opts = shuffle([target, ...others]);
    const box = $('#choices');
    box.innerHTML = '';
    opts.forEach((v, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'choice c' + (i + 1); b.textContent = v;
      b.setAttribute('aria-label', 'Number ' + v);
      b.addEventListener('click', () => choose(v, b));
      box.appendChild(b);
    });

    await sleep(500);
    if (!(await countAlong(k, tok))) return;
    bounce(lanterns[target]);
    S.busy = false; S.lastTouch = Date.now();
  }

  async function choose(v, btn) {
    Sound.unlock();
    S.lastTouch = Date.now();
    if (S.busy || btn.disabled) return;
    const tok = S.token, target = S.k + 1, q = lanterns[target];

    if (v !== target) {
      btn.classList.add('wrong'); btn.disabled = true;
      Sound.oops(); shake(q);
      S.busy = true;
      await sleep(700);
      if (await countAlong(S.k, tok)) { bounce(q); S.busy = false; }
      return;
    }

    S.busy = true;
    btn.classList.add('right');
    [...$('#choices').children].forEach((b) => (b.disabled = true));
    setState(target, 'lit'); bounce(q); sparkle(q); speak(q, target);
    Sound.chime(target); Sound.say(target);
    $('#qseq').innerHTML = seqText(target, false);
    setDots(S.k, 4);
    await sleep(1400);
    if (!alive(tok)) return;
    if (S.k >= 4) { finish(); return; }
    S.k++;
    runRound();
  }

  /* ----- Finish: count all five together, then celebrate ----- */
  async function finish() {
    const tok = S.token;
    S.busy = true;
    await sleep(1000);
    if (!(await countAlong(5, tok))) return;
    for (let n = 1; n <= 5; n++) sparkle(lanterns[n]);
    Sound.fanfare();
    const star = '<svg width="52" height="52" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/></svg>';
    $('#stars').innerHTML = star.repeat(5);
    [...$('#stars').children].forEach((s, i) => (s.style.animationDelay = (0.15 + i * 0.12) + 's'));
    const next = $('#nextBtn');
    next.firstChild.textContent = S.level === 1 ? 'Next: Level 2 ' : 'Back to start ';
    await sleep(500);
    if (!alive(tok)) return;
    $('#done').hidden = false;
    next.focus({ preventScroll: true });
  }

  /* ---------------- Wiring ---------------- */
  for (let n = 1; n <= 5; n++) {
    homeLanterns[n].addEventListener('click', () => {
      Sound.unlock(); bounce(homeLanterns[n]); sparkle(homeLanterns[n]); speak(homeLanterns[n], n); Sound.say(n);
    });
    lanterns[n].addEventListener('click', () => {
      Sound.unlock(); S.lastTouch = Date.now();
      if (S.level === 1) { level1Tap(n); return; }
      if (S.busy) return;
      const el = lanterns[n];
      if (el.classList.contains('lit')) { bounce(el); speak(el, n); Sound.say(n); }
      else if (el.classList.contains('question')) replay();
    });
  }

  async function replay() {
    Sound.unlock(); S.lastTouch = Date.now();
    if (S.busy) return;
    const tok = S.token;
    S.busy = true;
    const target = S.level === 1 ? S.next : S.k + 1;
    const ok = await countAlong(target - 1, tok);
    if (!ok) return;
    if (target <= 5) bounce(lanterns[target]);
    S.busy = false;
  }

  $('#go1').addEventListener('click', () => { Sound.unlock(); startLevel1(); });
  $('#go2').addEventListener('click', () => { Sound.unlock(); startLevel2(); });
  $('#back').addEventListener('click', () => { S.token++; S.busy = false; show('home'); });
  $('#replay').addEventListener('click', replay);
  $('#again').addEventListener('click', () => (S.level === 1 ? startLevel1() : startLevel2()));
  $('#nextBtn').addEventListener('click', () => {
    if (S.level === 1) startLevel2(); else { S.token++; show('home'); }
  });

  // Gentle nudge if a child hasn't tapped for a while.
  setInterval(() => {
    if ($('#play').hidden || !$('#done').hidden || S.busy) return;
    if (Date.now() - S.lastTouch < IDLE_NUDGE_MS) return;
    S.lastTouch = Date.now();
    const t = S.level === 1 ? S.next : S.k + 1;
    if (t <= 5) bounce(lanterns[t]);
  }, 1000);
})();
</script>
